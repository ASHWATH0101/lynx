sentence=Zero-allocation variable sync between microcontrollers over any serial link.
paragraph=Bind variables to ids and keep them in sync across UART, SPI, BLE or Wi-Fi: fire-and-forget publish, reliable writes with ACK and auto-retry, atomic batch writes, remote reads and an optional multi-drop bus mode. COBS framing with CRC-16, O(1) work per received byte, no heap.
